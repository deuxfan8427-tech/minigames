<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>에임 트레이너</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #14141f;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 380px;
    color: #eee;
    font-size: 15px;
    padding: 6px 10px;
    box-sizing: border-box;
  }
  #stage {
    position: relative;
    width: 340px;
    max-width: calc(100vw - 20px);
    box-sizing: border-box;
  }
  #aim-field {
    position: relative;
    width: 100%;
    height: 420px;
    background: #0b0b14;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    overflow: hidden;
    touch-action: none;
  }
  .aim-target {
    position: absolute;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #ff5f6d;
    border: 3px solid #fff;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px rgba(255,95,109,0.6);
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10,10,20,0.92);
    border-radius: 8px;
    color: #fff;
    text-align: center;
    padding: 16px;
    box-sizing: border-box;
  }
  #overlay h1 {
    font-size: 24px;
    margin: 0 0 10px;
  }
  #overlay p {
    margin: 0 0 18px;
    color: #bbb;
    font-size: 14px;
  }
  #overlay button {
    background: #4f8cff;
    color: #fff;
    border: none;
    padding: 10px 22px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
  }
  #overlay button:active {
    background: #3a72e0;
  }
  #nameInput {
    background: #1c1c2a;
    border: 1px solid #3a3a52;
    color: #fff;
    font-size: 15px;
    padding: 9px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
    text-align: center;
    width: 160px;
  }
  #nameInput:focus {
    outline: none;
    border-color: #4f8cff;
  }
  #leaderboard {
    margin-top: 20px;
    width: 200px;
    max-height: 220px;
    overflow-y: auto;
  }
  #leaderboard h2 {
    font-size: 13px;
    color: #999;
    margin: 0 0 8px;
    font-weight: normal;
  }
  #leaderboardList {
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 14px;
  }
  #leaderboardList li {
    display: flex;
    justify-content: space-between;
    padding: 4px 10px;
    color: #ddd;
  }
  #leaderboardList li:nth-child(odd) {
    background: rgba(255,255,255,0.04);
    border-radius: 4px;
  }
  #hint {
    color: #777;
    font-size: 12px;
    margin-top: 8px;
  }
  #versionTag {
    color: #444;
    font-size: 10px;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div>명중: <span id="hits">0</span></div>
    <div>⏱ <span id="timeLeft">30</span>초</div>
    <div>💰 <span id="money">0</span></div>
    <div><a href="index.html" style="color:#777;text-decoration:none;">← 목록</a></div>
  </div>
  <div id="stage">
    <div id="aim-field"></div>
    <div id="overlay">
      <h1 id="overlayTitle">에임 트레이너</h1>
      <p id="overlayMsg">30초 동안 빨간 원을 최대한 많이 클릭하세요</p>
      <input id="nameInput" type="text" maxlength="8" placeholder="이름 입력">
      <button id="startBtn">시작</button>
      <div id="leaderboard">
        <h2>최고 기록 TOP 10</h2>
        <ol id="leaderboardList"></ol>
      </div>
    </div>
  </div>
  <div id="hint">타겟을 클릭하면 바로 다음 타겟이 나와요</div>
  <div id="versionTag">v1.1.0 · 2026-08-11 업데이트</div>
</div>

<script type="module">
import { submitScore as lbSubmitScore, fetchTop10 as lbFetchTop10 } from './leaderboard.js';
import { moneyFromScore, addMoney, getWallet } from './economy.js';
import { findItem } from './shopItems.js';
(function() {
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlayTitle');
  var overlayMsg = document.getElementById('overlayMsg');
  var startBtn = document.getElementById('startBtn');
  var nameInput = document.getElementById('nameInput');
  var leaderboardList = document.getElementById('leaderboardList');
  var hitsEl = document.getElementById('hits');
  var timeLeftEl = document.getElementById('timeLeft');
  var moneyEl = document.getElementById('money');
  var field = document.getElementById('aim-field');

  var GAME_ID = 'aim-trainer';
  var LS_NAME_KEY = 'mg_playerName';
  var playerName = '플레이어';
  var DURATION = 30;

  var state = 'idle'; // idle | playing | over
  var hits = 0, timeLeft = DURATION, totalReaction = 0, targetTime = 0;
  var countdownTimer = null;
  var currentTarget = null;

  function loadName() {
    try {
      var saved = localStorage.getItem(LS_NAME_KEY);
      if (saved) {
        playerName = saved;
        nameInput.value = saved;
        refreshMoney();
      }
    } catch (e) {}
  }

  var targetColor = '#ff5f6d';

  function refreshMoney() {
    if (!playerName) return;
    getWallet(playerName).then(function(w) {
      moneyEl.textContent = w.money;
      var equipped = w.equipped || {};
      var themeItem = findItem(equipped.aim);
      targetColor = themeItem ? themeItem.value : '#ff5f6d';
    });
  }

  function renderLeaderboard() {
    leaderboardList.innerHTML = '';
    var loading = document.createElement('li');
    loading.textContent = '불러오는 중...';
    leaderboardList.appendChild(loading);

    lbFetchTop10(GAME_ID).then(function(list) {
      leaderboardList.innerHTML = '';
      if (list.length === 0) {
        var empty = document.createElement('li');
        empty.textContent = '아직 기록이 없어요';
        leaderboardList.appendChild(empty);
        return;
      }
      for (var i = 0; i < list.length; i++) {
        var li = document.createElement('li');
        var rank = document.createElement('span');
        rank.textContent = (i + 1) + '. ' + list[i].name;
        var pts = document.createElement('span');
        pts.textContent = list[i].score;
        li.appendChild(rank);
        li.appendChild(pts);
        leaderboardList.appendChild(li);
      }
    });
  }

  function submitFinalScore(name, finalScore) {
    lbSubmitScore(GAME_ID, name, finalScore).then(function() {
      renderLeaderboard();
    });
    var earned = moneyFromScore(GAME_ID, finalScore);
    if (earned > 0) {
      addMoney(name, earned).then(function() { refreshMoney(); });
    }
  }

  function showOverlay(title, msg, btnText) {
    overlayTitle.textContent = title;
    overlayMsg.textContent = msg;
    startBtn.textContent = btnText;
    overlay.style.display = 'flex';
  }

  function spawnTarget() {
    if (currentTarget) currentTarget.remove();

    var target = document.createElement('div');
    target.className = 'aim-target';
    target.style.background = targetColor;
    target.style.boxShadow = '0 0 12px ' + targetColor;

    var rect = field.getBoundingClientRect();
    var x = 30 + Math.random() * Math.max(1, rect.width - 60);
    var y = 30 + Math.random() * Math.max(1, rect.height - 60);
    target.style.left = x + 'px';
    target.style.top = y + 'px';

    targetTime = performance.now();

    target.addEventListener('click', function(e) {
      e.stopPropagation();
      if (state !== 'playing') return;
      var reaction = performance.now() - targetTime;
      totalReaction += reaction;
      hits++;
      hitsEl.textContent = hits;
      spawnTarget();
    });

    field.appendChild(target);
    currentTarget = target;
  }

  function startGame() {
    hits = 0;
    timeLeft = DURATION;
    totalReaction = 0;
    hitsEl.textContent = '0';
    timeLeftEl.textContent = timeLeft;

    state = 'playing';
    overlay.style.display = 'none';
    spawnTarget();

    countdownTimer = setInterval(function() {
      timeLeft--;
      timeLeftEl.textContent = timeLeft;
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    clearInterval(countdownTimer);
    state = 'over';
    if (currentTarget) { currentTarget.remove(); currentTarget = null; }

    var avg = hits > 0 ? Math.round(totalReaction / hits) : 0;
    var bonus = hits > 0 ? Math.round(Math.max(0, (500 - avg) / 5) / 10) * 10 : 0;
    var score = hits * 10 + bonus;

    submitFinalScore(playerName, score);
    showOverlay('게임 종료!', hits + '개 명중 · 평균 반응 ' + avg + 'ms · 점수 ' + score, '다시 시작');
  }

  startBtn.addEventListener('click', function() {
    var name = nameInput.value.trim().slice(0, 8);
    if (!name) name = '플레이어';
    playerName = name;
    try { localStorage.setItem(LS_NAME_KEY, playerName); } catch (e) {}
    refreshMoney();
    startGame();
  });

  nameInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') startBtn.click();
  });

  loadName();
  renderLeaderboard();
  showOverlay('에임 트레이너', '30초 동안 빨간 원을 최대한 많이 클릭하세요', '시작');
})();
</script>
</body>
</html>
