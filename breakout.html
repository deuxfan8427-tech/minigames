<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>벽돌깨기</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #14141f;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 480px;
    color: #eee;
    font-size: 16px;
    padding: 6px 10px;
    box-sizing: border-box;
  }
  #stage {
    position: relative;
  }
  canvas {
    background: #0b0b14;
    display: block;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    touch-action: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10,10,20,0.85);
    border-radius: 8px;
    color: #fff;
    text-align: center;
  }
  #overlay h1 {
    font-size: 26px;
    margin: 0 0 10px;
  }
  #overlay p {
    margin: 0 0 18px;
    color: #bbb;
    font-size: 14px;
  }
  #overlay button {
    background: #4f8cff;
    color: #fff;
    border: none;
    padding: 10px 22px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
  }
  #overlay button:active {
    background: #3a72e0;
  }
  #nameInput {
    background: #1c1c2a;
    border: 1px solid #3a3a52;
    color: #fff;
    font-size: 15px;
    padding: 9px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
    text-align: center;
    width: 160px;
  }
  #nameInput:focus {
    outline: none;
    border-color: #4f8cff;
  }
  #leaderboard {
    margin-top: 20px;
    width: 200px;
  }
  #leaderboard h2 {
    font-size: 13px;
    color: #999;
    margin: 0 0 8px;
    font-weight: normal;
  }
  #leaderboardList {
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 14px;
  }
  #leaderboardList li {
    display: flex;
    justify-content: space-between;
    padding: 4px 10px;
    color: #ddd;
  }
  #leaderboardList li:nth-child(odd) {
    background: rgba(255,255,255,0.04);
    border-radius: 4px;
  }
  #hint {
    color: #777;
    font-size: 12px;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div>점수: <span id="score">0</span></div>
    <div>레벨: <span id="level">1</span></div>
    <div>목숨: <span id="lives">3</span></div>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h1 id="overlayTitle">벽돌깨기</h1>
      <p id="overlayMsg">패들을 움직여 공을 튕겨 벽돌을 모두 깨보세요</p>
      <input id="nameInput" type="text" maxlength="8" placeholder="이름 입력">
      <button id="startBtn">시작</button>
      <div id="leaderboard">
        <h2>최고 기록 TOP 10</h2>
        <ol id="leaderboardList"></ol>
      </div>
    </div>
  </div>
  <div id="hint">PC: 마우스 이동 / 좌우 화살표 · 모바일: 좌우 드래그</div>
</div>

<script type="module">
import { submitScore as lbSubmitScore, fetchTop10 as lbFetchTop10 } from './leaderboard.js';
(function() {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlayTitle');
  var overlayMsg = document.getElementById('overlayMsg');
  var startBtn = document.getElementById('startBtn');
  var nameInput = document.getElementById('nameInput');
  var leaderboardList = document.getElementById('leaderboardList');
  var scoreEl = document.getElementById('score');
  var levelEl = document.getElementById('level');
  var livesEl = document.getElementById('lives');

  var GAME_ID = 'breakout';
  var LS_NAME_KEY = 'breakout_playerName';
  var playerName = '플레이어';

  function loadName() {
    try {
      var saved = localStorage.getItem(LS_NAME_KEY);
      if (saved) {
        playerName = saved;
        nameInput.value = saved;
      }
    } catch (e) {}
  }

  function renderLeaderboard() {
    leaderboardList.innerHTML = '';
    var loading = document.createElement('li');
    loading.textContent = '불러오는 중...';
    leaderboardList.appendChild(loading);

    lbFetchTop10(GAME_ID).then(function(list) {
      leaderboardList.innerHTML = '';
      if (list.length === 0) {
        var empty = document.createElement('li');
        empty.textContent = '아직 기록이 없어요';
        leaderboardList.appendChild(empty);
        return;
      }
      for (var i = 0; i < list.length; i++) {
        var li = document.createElement('li');
        var rank = document.createElement('span');
        rank.textContent = (i + 1) + '. ' + list[i].name;
        var pts = document.createElement('span');
        pts.textContent = list[i].score;
        li.appendChild(rank);
        li.appendChild(pts);
        leaderboardList.appendChild(li);
      }
    });
  }

  function submitScore(name, finalScore) {
    lbSubmitScore(GAME_ID, name, finalScore).then(function() {
      renderLeaderboard();
    });
  }

  var W, H, DPR;
  var ROWS = 5, COLS = 8;
  var WIN_LEVEL = 10;
  var BRICK_COLORS = ['#ff5f6d', '#ff9f43', '#feca57', '#1dd1a1', '#48dbfb', '#5f6dff'];
  var PATTERNS = [
    ['########', '########', '########', '########', '########'],
    ['#.#.#.#.', '.#.#.#.#', '#.#.#.#.', '.#.#.#.#', '#.#.#.#.'],
    ['...##...', '..####..', '.######.', '..####..', '...##...'],
    ['########', '.######.', '..####..', '...##...', '........'],
    ['##....##', '###..###', '########', '###..###', '##....##']
  ];

  var state = 'idle'; // idle | playing | won | over
  var score = 0, level = 1, lives = 3;
  var paddle, balls, bricks;

  function resize() {
    DPR = window.devicePixelRatio || 1;
    var maxW = Math.min(window.innerWidth - 20, 480);
    var maxH = window.innerHeight - 90;
    var w = maxW;
    var h = Math.min(maxH, w * 1.5);
    w = Math.min(w, h / 1.5);

    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = w * DPR;
    canvas.height = h * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    W = w; H = h;
    layoutBricks();
    if (paddle) {
      paddle.w = W * 0.2;
      paddle.h = Math.max(10, H * 0.018);
      paddle.y = H - paddle.h - 14;
      paddle.x = Math.min(Math.max(paddle.x, 0), W - paddle.w);
    }
  }

  function layoutBricks() {
    if (!bricks) return;
    var topMargin = H * 0.08;
    var sideMargin = W * 0.03;
    var gap = 4;
    var brickW = (W - sideMargin * 2 - gap * (COLS - 1)) / COLS;
    var brickH = H * 0.035;
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var b = bricks[r][c];
        if (!b) continue;
        b.x = sideMargin + c * (brickW + gap);
        b.y = topMargin + r * (brickH + gap);
        b.w = brickW;
        b.h = brickH;
      }
    }
  }

  function makeBricks() {
    var pattern = PATTERNS[(level - 1) % PATTERNS.length];
    ROWS = pattern.length;
    bricks = [];
    for (var r = 0; r < ROWS; r++) {
      var row = [];
      var rowStr = pattern[r];
      for (var c = 0; c < COLS; c++) {
        if (rowStr[c] === '#') {
          row.push({ alive: true, color: BRICK_COLORS[r % BRICK_COLORS.length] });
        } else {
          row.push(null);
        }
      }
      bricks.push(row);
    }
  }

  function ballCountForLevel(lv) {
    return Math.min(3, 1 + Math.floor((lv - 1) / 2));
  }

  function spawnBalls() {
    var speed = (10.0 + (level - 1) * 1.3) * (H / 640);
    var count = ballCountForLevel(level);
    var r = Math.max(5, W * 0.014);
    balls = [];
    for (var i = 0; i < count; i++) {
      var dirX = (i % 2 === 0) ? -1 : 1;
      var spread = (i - (count - 1) / 2) * 14;
      balls.push({
        x: W / 2 + spread,
        y: paddle.y - 10,
        r: r,
        vx: speed * dirX * (0.5 + Math.random() * 0.3),
        vy: -speed
      });
    }
  }

  function resetRound() {
    var pw = W * 0.2, ph = Math.max(10, H * 0.018);
    paddle = { x: (W - pw) / 2, y: H - ph - 14, w: pw, h: ph, targetX: (W - pw) / 2 };
    spawnBalls();
  }

  function startGame() {
    score = 0; level = 1; lives = 3;
    updateHud();
    makeBricks();
    layoutBricks();
    resetRound();
    state = 'playing';
    overlay.style.display = 'none';
  }

  function nextLevel() {
    level++;
    updateHud();
    makeBricks();
    layoutBricks();
    resetRound();
  }

  function loseLife() {
    lives--;
    updateHud();
    if (lives <= 0) {
      state = 'over';
      submitScore(playerName, score);
      showOverlay('게임 오버', '점수: ' + score + '  ·  다시 도전해보세요', '다시 시작');
    } else {
      resetRound();
    }
  }

  function checkWin() {
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        if (bricks[r][c] && bricks[r][c].alive) return false;
      }
    }
    return true;
  }

  function updateHud() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    livesEl.textContent = lives;
  }

  function showOverlay(title, msg, btnText) {
    overlayTitle.textContent = title;
    overlayMsg.textContent = msg;
    startBtn.textContent = btnText;
    overlay.style.display = 'flex';
  }

  // Input
  var pointerActive = false;

  function setPaddleCenterX(clientX) {
    var rect = canvas.getBoundingClientRect();
    var scale = W / rect.width;
    var x = (clientX - rect.left) * scale;
    paddle.targetX = x - paddle.w / 2;
  }

  canvas.addEventListener('mousemove', function(e) {
    setPaddleCenterX(e.clientX);
  });

  canvas.addEventListener('touchstart', function(e) {
    pointerActive = true;
    var t = e.touches[0];
    setPaddleCenterX(t.clientX);
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchmove', function(e) {
    var t = e.touches[0];
    setPaddleCenterX(t.clientX);
    e.preventDefault();
  }, { passive: false });

  var keys = {};
  window.addEventListener('keydown', function(e) {
    if (['ArrowLeft', 'ArrowRight'].indexOf(e.key) !== -1) e.preventDefault();
    keys[e.key] = true;
  });
  window.addEventListener('keyup', function(e) {
    keys[e.key] = false;
  });

  startBtn.addEventListener('click', function() {
    var name = nameInput.value.trim().slice(0, 8);
    if (!name) name = '플레이어';
    playerName = name;
    try { localStorage.setItem(LS_NAME_KEY, playerName); } catch (e) {}
    startGame();
  });

  nameInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') startBtn.click();
  });

  function update() {
    if (state !== 'playing') return;

    // paddle movement
    var followSpeed = 0.35;
    if (keys['ArrowLeft']) paddle.targetX = paddle.x - 12;
    if (keys['ArrowRight']) paddle.targetX = paddle.x + 12;
    paddle.targetX = Math.min(Math.max(paddle.targetX, 0), W - paddle.w);
    paddle.x += (paddle.targetX - paddle.x) * followSpeed;
    paddle.x = Math.min(Math.max(paddle.x, 0), W - paddle.w);

    // balls movement
    for (var i = balls.length - 1; i >= 0; i--) {
      var ball = balls[i];
      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -1; }
      if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx *= -1; }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; }

      // paddle collision
      if (ball.vy > 0 &&
          ball.y + ball.r >= paddle.y &&
          ball.y + ball.r <= paddle.y + paddle.h + Math.abs(ball.vy) &&
          ball.x >= paddle.x - ball.r &&
          ball.x <= paddle.x + paddle.w + ball.r) {
        ball.y = paddle.y - ball.r;
        var hitPos = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
        var speed = Math.hypot(ball.vx, ball.vy);
        var maxAngle = Math.PI * 0.4;
        var angle = hitPos * maxAngle;
        ball.vx = speed * Math.sin(angle);
        ball.vy = -Math.abs(speed * Math.cos(angle));
      }

      // brick collision
      outer:
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          var b = bricks[r][c];
          if (!b || !b.alive) continue;
          if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
              ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
            b.alive = false;
            score += 10;
            updateHud();

            var overlapLeft = (ball.x + ball.r) - b.x;
            var overlapRight = (b.x + b.w) - (ball.x - ball.r);
            var overlapTop = (ball.y + ball.r) - b.y;
            var overlapBottom = (b.y + b.h) - (ball.y - ball.r);
            var minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

            if (minOverlap === overlapTop || minOverlap === overlapBottom) {
              ball.vy *= -1;
            } else {
              ball.vx *= -1;
            }
            break outer;
          }
        }
      }

      // ball falls below paddle
      if (ball.y - ball.r > H) {
        balls.splice(i, 1);
      }
    }

    if (balls.length === 0) {
      loseLife();
      return;
    }

    if (checkWin()) {
      if (level >= WIN_LEVEL) {
        state = 'won';
        submitScore(playerName, score);
        showOverlay('클리어!', '최종 점수: ' + score, '다시 시작');
      } else {
        nextLevel();
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // bricks
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var b = bricks[r][c];
        if (!b || !b.alive) continue;
        ctx.fillStyle = b.color;
        roundRect(ctx, b.x, b.y, b.w, b.h, 4);
        ctx.fill();
      }
    }

    // paddle
    ctx.fillStyle = '#e8e8f5';
    roundRect(ctx, paddle.x, paddle.y, paddle.w, paddle.h, paddle.h / 2);
    ctx.fill();

    // balls
    ctx.fillStyle = '#ffffff';
    for (var i = 0; i < balls.length; i++) {
      ctx.beginPath();
      ctx.arc(balls[i].x, balls[i].y, balls[i].r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  makeBricks();
  layoutBricks();
  resetRound();
  draw();
  loadName();
  renderLeaderboard();
  showOverlay('벽돌깨기', '패들을 움직여 공을 튕겨 벽돌을 모두 깨보세요', '시작');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
