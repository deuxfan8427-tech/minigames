<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>벽돌깨기</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #14141f;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 480px;
    color: #eee;
    font-size: 16px;
    padding: 6px 10px;
    box-sizing: border-box;
  }
  #stage {
    position: relative;
  }
  canvas {
    background: #0b0b14;
    display: block;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    touch-action: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10,10,20,0.85);
    border-radius: 8px;
    color: #fff;
    text-align: center;
  }
  #overlay h1 {
    font-size: 26px;
    margin: 0 0 10px;
  }
  #overlay p {
    margin: 0 0 18px;
    color: #bbb;
    font-size: 14px;
  }
  #overlay button {
    background: #4f8cff;
    color: #fff;
    border: none;
    padding: 10px 22px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
  }
  #overlay button:active {
    background: #3a72e0;
  }
  #mainPanel, #itemInfoPanel {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-height: 90%;
    overflow-y: auto;
    padding: 0 6px;
  }
  .linkBtn {
    background: transparent !important;
    color: #7fa8ff !important;
    padding: 6px !important;
    font-size: 13px !important;
    margin-top: 10px;
    text-decoration: underline;
  }
  .linkBtn:active {
    background: transparent !important;
  }
  .recordBanner {
    background: linear-gradient(90deg, #ff6ec7, #ffd700, #6ec7ff, #ff6ec7);
    background-size: 300% 100%;
    animation: recordShift 2.5s linear infinite;
    color: #1c1c2a;
    font-weight: bold;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  @keyframes recordShift {
    to { background-position: 300% 0; }
  }
  #itemInfoList {
    width: 100%;
    max-width: 280px;
    text-align: left;
    margin-bottom: 16px;
  }
  .itemRow {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 6px;
    border-bottom: 1px solid #2a2a3a;
  }
  .itemSwatch {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 11px;
    color: #0b0b14;
    border: 3px solid;
  }
  .itemRow .itemName {
    font-size: 14px;
    font-weight: bold;
  }
  .itemRow .itemName.good { color: #2ecc71; }
  .itemRow .itemName.bad { color: #e74c3c; }
  .itemRow .itemDesc {
    font-size: 12px;
    color: #999;
  }
  #nameInput {
    background: #1c1c2a;
    border: 1px solid #3a3a52;
    color: #fff;
    font-size: 15px;
    padding: 9px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
    text-align: center;
    width: 160px;
  }
  #nameInput:focus {
    outline: none;
    border-color: #4f8cff;
  }
  #leaderboard {
    margin-top: 20px;
    width: 200px;
  }
  #leaderboard h2 {
    font-size: 13px;
    color: #999;
    margin: 0 0 8px;
    font-weight: normal;
  }
  #leaderboardList {
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 14px;
  }
  #leaderboardList li {
    display: flex;
    justify-content: space-between;
    padding: 4px 10px;
    color: #ddd;
  }
  #leaderboardList li:nth-child(odd) {
    background: rgba(255,255,255,0.04);
    border-radius: 4px;
  }
  #hint {
    color: #777;
    font-size: 12px;
    margin-top: 8px;
  }
  #versionTag {
    color: #444;
    font-size: 10px;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div>점수: <span id="score">0</span></div>
    <div>레벨: <span id="level">1</span></div>
    <div>목숨: <span id="lives">3</span></div>
    <div>💰 <span id="money">0</span></div>
    <div><a href="index.html" style="color:#777;text-decoration:none;">← 목록</a></div>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="overlay">
      <div id="mainPanel">
        <div id="recordBanner" class="recordBanner" style="display:none;"></div>
        <h1 id="overlayTitle">벽돌깨기</h1>
        <p id="overlayMsg">패들을 움직여 공을 튕겨 벽돌을 모두 깨보세요</p>
        <input id="nameInput" type="text" maxlength="8" placeholder="이름 입력">
        <button id="startBtn">시작</button>
        <button id="showItemInfoBtn" class="linkBtn">아이템 설명 보기</button>
        <a href="shop.html" class="linkBtn" style="display:inline-block;text-decoration:none;">🛍️ 상점 가기</a>
        <div id="leaderboard">
          <h2>최고 기록 TOP 10</h2>
          <ol id="leaderboardList"></ol>
        </div>
      </div>
      <div id="itemInfoPanel" style="display:none;">
        <h1>아이템 설명</h1>
        <div id="itemInfoList"></div>
        <button id="closeItemInfoBtn" class="mainBtn">닫기</button>
      </div>
    </div>
  </div>
  <div id="hint">PC: 마우스 이동 / 좌우 화살표 · 모바일: 좌우 드래그</div>
  <div id="versionTag">v1.1.0 · 2026-08-11 업데이트</div>
</div>

<script type="module">
import { submitScore as lbSubmitScore, fetchTop10 as lbFetchTop10 } from './leaderboard.js';
import { moneyFromScore, addMoney, getWallet } from './economy.js';
import { findItem } from './shopItems.js';
import { checkAndUpdateRecord } from './records.js';
(function() {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var mainPanel = document.getElementById('mainPanel');
  var recordBanner = document.getElementById('recordBanner');
  var itemInfoPanel = document.getElementById('itemInfoPanel');
  var itemInfoList = document.getElementById('itemInfoList');
  var showItemInfoBtn = document.getElementById('showItemInfoBtn');
  var closeItemInfoBtn = document.getElementById('closeItemInfoBtn');
  var overlayTitle = document.getElementById('overlayTitle');
  var overlayMsg = document.getElementById('overlayMsg');
  var startBtn = document.getElementById('startBtn');
  var nameInput = document.getElementById('nameInput');
  var leaderboardList = document.getElementById('leaderboardList');
  var scoreEl = document.getElementById('score');
  var levelEl = document.getElementById('level');
  var livesEl = document.getElementById('lives');
  var moneyEl = document.getElementById('money');

  var GAME_ID = 'breakout';
  var LS_NAME_KEY = 'mg_playerName';
  var playerName = '플레이어';

  function loadName() {
    try {
      var saved = localStorage.getItem(LS_NAME_KEY);
      if (saved) {
        playerName = saved;
        nameInput.value = saved;
        refreshMoney();
      }
    } catch (e) {}
  }

  var ballColor = '#ffffff';
  var paddleColor = '#e8e8f5';
  var ballSparkle = false;
  var paddleSparkle = false;

  function refreshMoney() {
    if (!playerName) return;
    getWallet(playerName).then(function(w) {
      moneyEl.textContent = w.money;
      var equipped = w.equipped || {};
      var ballItem = findItem(equipped.ball);
      var paddleItem = findItem(equipped.paddle);
      ballColor = ballItem ? ballItem.value : '#ffffff';
      ballSparkle = ballItem ? !!ballItem.sparkle : false;
      paddleColor = paddleItem ? paddleItem.value : '#e8e8f5';
      paddleSparkle = paddleItem ? !!paddleItem.sparkle : false;
    });
  }

  function sparkleColor() {
    var hue = (Date.now() / 15) % 360;
    return 'hsl(' + hue + ', 85%, 65%)';
  }

  function drawSparkleDots(cx, cy, r) {
    var t = Date.now();
    var offsets = [[-0.4, -0.3], [0.3, 0.2], [0, -0.5], [0.4, 0.4]];
    for (var i = 0; i < offsets.length; i++) {
      var alpha = 0.3 + 0.7 * Math.abs(Math.sin(t / 220 + i * 1.7));
      ctx.beginPath();
      ctx.arc(cx + offsets[i][0] * r, cy + offsets[i][1] * r, Math.max(1, r * 0.16), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(2) + ')';
      ctx.fill();
    }
  }

  function renderLeaderboard() {
    leaderboardList.innerHTML = '';
    var loading = document.createElement('li');
    loading.textContent = '불러오는 중...';
    leaderboardList.appendChild(loading);

    lbFetchTop10(GAME_ID).then(function(list) {
      leaderboardList.innerHTML = '';
      if (list.length === 0) {
        var empty = document.createElement('li');
        empty.textContent = '아직 기록이 없어요';
        leaderboardList.appendChild(empty);
        return;
      }
      for (var i = 0; i < list.length; i++) {
        var li = document.createElement('li');
        var rank = document.createElement('span');
        rank.textContent = (i + 1) + '. ' + list[i].name;
        var pts = document.createElement('span');
        pts.textContent = list[i].score;
        li.appendChild(rank);
        li.appendChild(pts);
        leaderboardList.appendChild(li);
      }
    });
  }

  function showRecordBanner(isNewNumberOne, isPersonalBest) {
    if (isNewNumberOne) {
      recordBanner.textContent = '🏆 새로운 1위 기록입니다!';
    } else if (isPersonalBest) {
      recordBanner.textContent = '🎉 개인 최고 기록 갱신!';
    }
    recordBanner.style.display = 'block';
  }

  function submitScore(name, finalScore) {
    var rec = checkAndUpdateRecord(GAME_ID, finalScore);
    lbSubmitScore(GAME_ID, name, finalScore).then(function() {
      renderLeaderboard();
      return lbFetchTop10(GAME_ID);
    }).then(function(list) {
      var isNewNumberOne = list.length > 0 && list[0].name === name && list[0].score === finalScore;
      if (isNewNumberOne || rec.isPersonalBest) {
        showRecordBanner(isNewNumberOne, rec.isPersonalBest);
      }
    });
    var earned = moneyFromScore(GAME_ID, finalScore);
    if (earned > 0) {
      addMoney(name, earned).then(function() { refreshMoney(); });
    }
  }

  var W, H, DPR;
  var ROWS = 5, COLS = 8;
  var WIN_LEVEL = 10;
  var BRICK_COLORS = ['#ff5f6d', '#ff9f43', '#feca57', '#1dd1a1', '#48dbfb', '#5f6dff'];
  var PATTERNS = [
    ['########', '########', '########', '########', '########'],
    ['#.#.#.#.', '.#.#.#.#', '#.#.#.#.', '.#.#.#.#', '#.#.#.#.'],
    ['...##...', '..####..', '.######.', '..####..', '...##...'],
    ['########', '.######.', '..####..', '...##...', '........'],
    ['##....##', '###..###', '########', '###..###', '##....##']
  ];

  var state = 'idle'; // idle | playing | won | over
  var score = 0, level = 1, lives = 3;
  var paddle, balls, bricks;
  var items, paddleBaseW;
  var paddleSizeFactor = 1, paddleSizeTimer = 0;
  var ballSpeedFactor = 1, ballSpeedTimer = 0;
  var pierceTimer = 0;

  var ITEM_META = {
    paddleGrow: { label: 'L+', color: '#1dd1a1', good: true, name: '막대 길어짐', desc: '패들이 8초간 1.5배 길어져요' },
    ballSlow: { label: 'V-', color: '#48dbfb', good: true, name: '공 느려짐', desc: '공 속도가 8초간 느려져요' },
    multiBall: { label: 'x3', color: '#feca57', good: true, name: '공 3개', desc: '공이 최대 3개까지 늘어나요' },
    pierce: { label: 'P', color: '#a29bfe', good: true, name: '벽돌 관통', desc: '8초간 공이 벽돌을 뚫고 지나가요' },
    paddleShrink: { label: 'L-', color: '#ff5f6d', good: false, name: '막대 짧아짐', desc: '패들이 8초간 0.6배로 짧아져요' },
    ballFast: { label: 'V+', color: '#ff9f43', good: false, name: '공 빨라짐', desc: '공 속도가 8초간 빨라져요' }
  };
  var ITEM_GOOD_POOL = ['paddleGrow', 'ballSlow', 'multiBall', 'pierce'];
  var ITEM_BAD_POOL = ['paddleShrink', 'ballFast'];
  var ITEM_DURATION = 8000;

  function resize() {
    DPR = window.devicePixelRatio || 1;
    var maxW = Math.min(window.innerWidth - 20, 480);
    var maxH = window.innerHeight - 90;
    var w = maxW;
    var h = Math.min(maxH, w * 1.5);
    w = Math.min(w, h / 1.5);

    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = w * DPR;
    canvas.height = h * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    W = w; H = h;
    layoutBricks();
    if (paddle) {
      paddleBaseW = W * 0.2;
      paddle.w = paddleBaseW * paddleSizeFactor;
      paddle.h = Math.max(10, H * 0.018);
      paddle.y = H - paddle.h - 14;
      paddle.x = Math.min(Math.max(paddle.x, 0), W - paddle.w);
    }
  }

  function layoutBricks() {
    if (!bricks) return;
    var topMargin = H * 0.08;
    var sideMargin = W * 0.03;
    var gap = 4;
    var brickW = (W - sideMargin * 2 - gap * (COLS - 1)) / COLS;
    var brickH = H * 0.035;
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var b = bricks[r][c];
        if (!b) continue;
        b.x = sideMargin + c * (brickW + gap);
        b.y = topMargin + r * (brickH + gap);
        b.w = brickW;
        b.h = brickH;
      }
    }
  }

  function makeBricks() {
    var pattern = PATTERNS[(level - 1) % PATTERNS.length];
    ROWS = pattern.length;
    bricks = [];
    for (var r = 0; r < ROWS; r++) {
      var row = [];
      var rowStr = pattern[r];
      for (var c = 0; c < COLS; c++) {
        if (rowStr[c] === '#') {
          row.push({ alive: true, color: BRICK_COLORS[r % BRICK_COLORS.length] });
        } else {
          row.push(null);
        }
      }
      bricks.push(row);
    }
  }

  function ballCountForLevel(lv) {
    return Math.min(3, 1 + Math.floor((lv - 1) / 2));
  }

  function spawnBalls() {
    var speed = (8.5 + (level - 1) * 1.3) * (H / 640);
    var count = ballCountForLevel(level);
    var r = Math.max(5, W * 0.014);
    balls = [];
    for (var i = 0; i < count; i++) {
      var dirX = (i % 2 === 0) ? -1 : 1;
      var spread = (i - (count - 1) / 2) * 14;
      balls.push({
        x: W / 2 + spread,
        y: paddle.y - 10,
        r: r,
        vx: speed * dirX * (0.5 + Math.random() * 0.3),
        vy: -speed
      });
    }
  }

  function resetRound() {
    paddleSizeFactor = 1; paddleSizeTimer = 0;
    ballSpeedFactor = 1; ballSpeedTimer = 0;
    pierceTimer = 0;
    items = [];

    paddleBaseW = W * 0.2;
    var pw = paddleBaseW, ph = Math.max(10, H * 0.018);
    paddle = { x: (W - pw) / 2, y: H - ph - 14, w: pw, h: ph, targetX: (W - pw) / 2 };
    spawnBalls();
  }

  function pickItemType() {
    var isGood = Math.random() < 0.7;
    var pool = isGood ? ITEM_GOOD_POOL : ITEM_BAD_POOL;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function spawnItem(x, y) {
    items.push({ x: x, y: y, type: pickItemType(), vy: H * 0.006 });
  }

  function addExtraBalls() {
    var src = balls[0];
    if (!src) return;
    var speed = Math.hypot(src.vx, src.vy) || (10 * (H / 640));
    while (balls.length < 3) {
      var angle = Math.random() * 0.6 - 0.3;
      balls.push({
        x: src.x,
        y: src.y,
        r: src.r,
        vx: speed * Math.sin(angle),
        vy: -Math.abs(speed * Math.cos(angle))
      });
    }
  }

  function applyItem(type) {
    if (type === 'paddleGrow') { paddleSizeFactor = 1.5; paddleSizeTimer = ITEM_DURATION; }
    else if (type === 'paddleShrink') { paddleSizeFactor = 0.6; paddleSizeTimer = ITEM_DURATION; }
    else if (type === 'ballSlow') { ballSpeedFactor = 0.6; ballSpeedTimer = ITEM_DURATION; }
    else if (type === 'ballFast') { ballSpeedFactor = 1.5; ballSpeedTimer = ITEM_DURATION; }
    else if (type === 'pierce') { pierceTimer = ITEM_DURATION; }
    else if (type === 'multiBall') { addExtraBalls(); }
  }

  function startGame() {
    score = 0; level = 1; lives = 3;
    updateHud();
    makeBricks();
    layoutBricks();
    resetRound();
    state = 'playing';
    overlay.style.display = 'none';
  }

  function nextLevel() {
    level++;
    updateHud();
    makeBricks();
    layoutBricks();
    resetRound();
  }

  function loseLife() {
    lives--;
    updateHud();
    if (lives <= 0) {
      state = 'over';
      submitScore(playerName, score);
      showOverlay('게임 오버', '점수: ' + score + '  ·  다시 도전해보세요', '다시 시작');
    } else {
      resetRound();
    }
  }

  function checkWin() {
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        if (bricks[r][c] && bricks[r][c].alive) return false;
      }
    }
    return true;
  }

  function updateHud() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    livesEl.textContent = lives;
  }

  function showOverlay(title, msg, btnText) {
    overlayTitle.textContent = title;
    overlayMsg.textContent = msg;
    startBtn.textContent = btnText;
    overlay.style.display = 'flex';
    mainPanel.style.display = 'flex';
    itemInfoPanel.style.display = 'none';
    recordBanner.style.display = 'none';
  }

  function renderItemInfo() {
    itemInfoList.innerHTML = '';
    var order = ITEM_GOOD_POOL.concat(ITEM_BAD_POOL);
    for (var i = 0; i < order.length; i++) {
      var meta = ITEM_META[order[i]];
      var row = document.createElement('div');
      row.className = 'itemRow';

      var swatch = document.createElement('div');
      swatch.className = 'itemSwatch';
      swatch.style.background = meta.color;
      swatch.style.borderColor = meta.good ? '#2ecc71' : '#e74c3c';
      swatch.textContent = meta.label;

      var text = document.createElement('div');
      var nameEl = document.createElement('div');
      nameEl.className = 'itemName ' + (meta.good ? 'good' : 'bad');
      nameEl.textContent = meta.name + (meta.good ? ' (좋음)' : ' (나쁨)');
      var descEl = document.createElement('div');
      descEl.className = 'itemDesc';
      descEl.textContent = meta.desc;
      text.appendChild(nameEl);
      text.appendChild(descEl);

      row.appendChild(swatch);
      row.appendChild(text);
      itemInfoList.appendChild(row);
    }
  }

  showItemInfoBtn.addEventListener('click', function() {
    renderItemInfo();
    mainPanel.style.display = 'none';
    itemInfoPanel.style.display = 'flex';
  });

  closeItemInfoBtn.addEventListener('click', function() {
    itemInfoPanel.style.display = 'none';
    mainPanel.style.display = 'flex';
  });

  // Input
  var pointerActive = false;

  function setPaddleCenterX(clientX) {
    var rect = canvas.getBoundingClientRect();
    var scale = W / rect.width;
    var x = (clientX - rect.left) * scale;
    paddle.targetX = x - paddle.w / 2;
  }

  canvas.addEventListener('mousemove', function(e) {
    setPaddleCenterX(e.clientX);
  });

  canvas.addEventListener('touchstart', function(e) {
    pointerActive = true;
    var t = e.touches[0];
    setPaddleCenterX(t.clientX);
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchmove', function(e) {
    var t = e.touches[0];
    setPaddleCenterX(t.clientX);
    e.preventDefault();
  }, { passive: false });

  var keys = {};
  window.addEventListener('keydown', function(e) {
    if (['ArrowLeft', 'ArrowRight'].indexOf(e.key) !== -1) e.preventDefault();
    keys[e.key] = true;
  });
  window.addEventListener('keyup', function(e) {
    keys[e.key] = false;
  });

  startBtn.addEventListener('click', function() {
    var name = nameInput.value.trim().slice(0, 8);
    if (!name) name = '플레이어';
    playerName = name;
    try { localStorage.setItem(LS_NAME_KEY, playerName); } catch (e) {}
    refreshMoney();
    startGame();
  });

  nameInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') startBtn.click();
  });

  function update(dt) {
    if (state !== 'playing') return;

    if (paddleSizeTimer > 0) {
      paddleSizeTimer -= dt;
      if (paddleSizeTimer <= 0) { paddleSizeTimer = 0; paddleSizeFactor = 1; }
    }
    if (ballSpeedTimer > 0) {
      ballSpeedTimer -= dt;
      if (ballSpeedTimer <= 0) { ballSpeedTimer = 0; ballSpeedFactor = 1; }
    }
    if (pierceTimer > 0) {
      pierceTimer -= dt;
      if (pierceTimer < 0) pierceTimer = 0;
    }

    // paddle movement
    var followSpeed = 0.35;
    paddle.w = paddleBaseW * paddleSizeFactor;
    if (keys['ArrowLeft']) paddle.targetX = paddle.x - 12;
    if (keys['ArrowRight']) paddle.targetX = paddle.x + 12;
    paddle.targetX = Math.min(Math.max(paddle.targetX, 0), W - paddle.w);
    paddle.x += (paddle.targetX - paddle.x) * followSpeed;
    paddle.x = Math.min(Math.max(paddle.x, 0), W - paddle.w);

    // falling items
    for (var k = items.length - 1; k >= 0; k--) {
      var it = items[k];
      it.y += it.vy;
      if (it.y + 12 >= paddle.y && it.y - 12 <= paddle.y + paddle.h &&
          it.x >= paddle.x - 12 && it.x <= paddle.x + paddle.w + 12) {
        applyItem(it.type);
        items.splice(k, 1);
        continue;
      }
      if (it.y - 12 > H) items.splice(k, 1);
    }

    // balls movement
    for (var i = balls.length - 1; i >= 0; i--) {
      var ball = balls[i];
      ball.x += ball.vx * ballSpeedFactor;
      ball.y += ball.vy * ballSpeedFactor;

      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -1; }
      if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx *= -1; }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; }

      // paddle collision
      if (ball.vy > 0 &&
          ball.y + ball.r >= paddle.y &&
          ball.y + ball.r <= paddle.y + paddle.h + Math.abs(ball.vy * ballSpeedFactor) &&
          ball.x >= paddle.x - ball.r &&
          ball.x <= paddle.x + paddle.w + ball.r) {
        ball.y = paddle.y - ball.r;
        var hitPos = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
        var speed = Math.hypot(ball.vx, ball.vy);
        var maxAngle = Math.PI * 0.4;
        var angle = hitPos * maxAngle;
        ball.vx = speed * Math.sin(angle);
        ball.vy = -Math.abs(speed * Math.cos(angle));
      }

      // brick collision
      outer:
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          var b = bricks[r][c];
          if (!b || !b.alive) continue;
          if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
              ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
            b.alive = false;
            score += 10;
            updateHud();
            if (Math.random() < 0.25) spawnItem(b.x + b.w / 2, b.y + b.h / 2);

            if (pierceTimer <= 0) {
              var overlapLeft = (ball.x + ball.r) - b.x;
              var overlapRight = (b.x + b.w) - (ball.x - ball.r);
              var overlapTop = (ball.y + ball.r) - b.y;
              var overlapBottom = (b.y + b.h) - (ball.y - ball.r);
              var minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

              if (minOverlap === overlapTop || minOverlap === overlapBottom) {
                ball.vy *= -1;
              } else {
                ball.vx *= -1;
              }
            }
            break outer;
          }
        }
      }

      // ball falls below paddle
      if (ball.y - ball.r > H) {
        balls.splice(i, 1);
      }
    }

    if (balls.length === 0) {
      loseLife();
      return;
    }

    if (checkWin()) {
      if (level >= WIN_LEVEL) {
        state = 'won';
        submitScore(playerName, score);
        showOverlay('클리어!', '최종 점수: ' + score, '다시 시작');
      } else {
        nextLevel();
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // bricks
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var b = bricks[r][c];
        if (!b || !b.alive) continue;
        ctx.fillStyle = b.color;
        roundRect(ctx, b.x, b.y, b.w, b.h, 4);
        ctx.fill();
      }
    }

    // paddle
    ctx.fillStyle = paddleSparkle ? sparkleColor() : paddleColor;
    roundRect(ctx, paddle.x, paddle.y, paddle.w, paddle.h, paddle.h / 2);
    ctx.fill();
    if (paddleSparkle) drawSparkleDots(paddle.x + paddle.w / 2, paddle.y + paddle.h / 2, paddle.h);

    // balls
    for (var i = 0; i < balls.length; i++) {
      ctx.beginPath();
      ctx.arc(balls[i].x, balls[i].y, balls[i].r, 0, Math.PI * 2);
      ctx.fillStyle = pierceTimer > 0 ? '#ffe066' : (ballSparkle ? sparkleColor() : ballColor);
      ctx.fill();
      if (ballSparkle && pierceTimer <= 0) drawSparkleDots(balls[i].x, balls[i].y, balls[i].r);
    }

    // falling items
    if (items) {
      for (var k = 0; k < items.length; k++) {
        var it = items[k];
        var meta = ITEM_META[it.type];
        roundRect(ctx, it.x - 14, it.y - 14, 28, 28, 7);
        ctx.strokeStyle = meta.good ? '#2ecc71' : '#e74c3c';
        ctx.lineWidth = 3;
        ctx.stroke();
        roundRect(ctx, it.x - 13, it.y - 13, 26, 26, 6);
        ctx.fillStyle = meta.color;
        ctx.fill();
        ctx.fillStyle = '#0b0b14';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(meta.label, it.x, it.y + 1);
        ctx.font = 'bold 10px sans-serif';
        ctx.fillStyle = meta.good ? '#2ecc71' : '#e74c3c';
        ctx.fillText(meta.good ? '▲' : '▼', it.x, it.y - 19);
      }
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  var lastTime = 0;
  function loop(ts) {
    if (!lastTime) lastTime = ts;
    var dt = ts - lastTime;
    lastTime = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  makeBricks();
  layoutBricks();
  resetRound();
  draw();
  loadName();
  renderLeaderboard();
  showOverlay('벽돌깨기', '패들을 움직여 공을 튕겨 벽돌을 모두 깨보세요', '시작');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
