<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미니게임 모음</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #14141f;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    color: #eee;
  }
  #wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header h1 {
    font-size: 26px;
    margin: 0 0 8px;
  }
  header p {
    color: #999;
    font-size: 14px;
    margin: 0;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
  }
  .card {
    position: relative;
    display: block;
    background: #1c1c2a;
    border: 1px solid #2c2c40;
    border-radius: 12px;
    padding: 20px 16px;
    text-align: center;
    text-decoration: none;
    color: #eee;
    transition: transform 0.15s, border-color 0.15s;
  }
  a.card:active {
    transform: scale(0.97);
    border-color: #4f8cff;
  }
  .card .icon {
    font-size: 34px;
    margin-bottom: 10px;
  }
  .card .title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 4px;
  }
  .card .desc {
    font-size: 12px;
    color: #999;
  }
  .card.disabled {
    opacity: 0.45;
    cursor: default;
  }
  .badge {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    color: #aaa;
  }
  .badge.ready {
    background: rgba(79,140,255,0.2);
    color: #7fa8ff;
  }
  footer {
    text-align: center;
    color: #555;
    font-size: 12px;
    margin-top: 32px;
  }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>미니게임 모음</h1>
    <p>가볍게 시간 때우기 좋은 고전 미니게임 모음이에요</p>
  </header>
  <div id="grid">
    <a class="card" href="breakout.html">
      <span class="badge ready">플레이 가능</span>
      <div class="icon">🧱</div>
      <div class="title">벽돌깨기</div>
      <div class="desc">공을 튕겨 벽돌을 깨보세요</div>
    </a>
    <div class="card disabled">
      <span class="badge">준비중</span>
      <div class="icon">🐍</div>
      <div class="title">스네이크</div>
      <div class="desc">먹고 자라는 클래식 뱀 게임</div>
    </div>
    <div class="card disabled">
      <span class="badge">준비중</span>
      <div class="icon">🚗</div>
      <div class="title">자동차 피하기</div>
      <div class="desc">3차선을 오가며 장애물 회피</div>
    </div>
    <div class="card disabled">
      <span class="badge">준비중</span>
      <div class="icon">🧩</div>
      <div class="title">테트리스</div>
      <div class="desc">블록을 쌓고 줄을 지우세요</div>
    </div>
    <div class="card disabled">
      <span class="badge">준비중</span>
      <div class="icon">⚾</div>
      <div class="title">숫자야구</div>
      <div class="desc">숫자를 추리하는 두뇌 게임</div>
    </div>
  </div>
  <footer>친구에게 링크를 보내고 같이 즐겨보세요</footer>
</div>
</body>
</html>
